name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 18:00 UTC (~11:30 PM IST)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: generate-github-3d-contribution
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: Rudra152005

      - name: commit and push artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f ./profile-3d-contrib/*.svg
          git commit -m "generate 3D contribution graph" || exit 0
          git push
