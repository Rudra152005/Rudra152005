<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skylineFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tinyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes drift {
        0% { transform: translateX(0); }
        50% { transform: translateX(14px); }
        100% { transform: translateX(0); }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 0.3; }
        45% { opacity: 0.7; }
        55% { opacity: 0.35; }
        70% { opacity: 0.6; }
      }
      .glowPulse { animation: pulse 4s ease-in-out infinite; }
      .haloDrift { animation: drift 9s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .screenFlicker { animation: flicker 3.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- base -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- faint distant skyline, far right, cinematic night-city cue -->
  <g fill="url(#skylineFade)" opacity="0.6">
    <rect x="1430" y="170" width="18" height="180"/>
    <rect x="1455" y="140" width="14" height="210"/>
    <rect x="1478" y="195" width="22" height="155"/>
    <rect x="1508" y="120" width="16" height="230"/>
    <rect x="1532" y="165" width="20" height="185"/>
    <rect x="1560" y="150" width="14" height="200"/>
  </g>
  <g fill="#3B82F6" opacity="0.35">
    <rect x="1436" y="190" width="2" height="2" class="glowPulse"/>
    <rect x="1462" y="170" width="2" height="2" class="glowPulse"/>
    <rect x="1486" y="220" width="2" height="2" class="glowPulse"/>
    <rect x="1514" y="160" width="2" height="2" class="glowPulse"/>
    <rect x="1540" y="200" width="2" height="2" class="glowPulse"/>
  </g>

  <!-- light sweep across whole banner -->
  <rect x="0" y="0" width="1600" height="500" fill="url(#sweep)"/>

  <!-- subtle background code, far left -->
  <g font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.05">
    <text x="40" y="50">function build() {</text>
    <text x="60" y="70">return shipIt();</text>
    <text x="40" y="90">}</text>
    <text x="40" y="445">// commit. push. repeat.</text>
  </g>

  <!-- drifting particle field -->
  <g fill="#3B82F6" class="haloDrift">
    <circle cx="980" cy="70" r="1.6" fill-opacity="0.5"/>
    <circle cx="1120" cy="120" r="1.2" fill-opacity="0.4"/>
    <circle cx="1300" cy="55" r="1.8" fill-opacity="0.45"/>
    <circle cx="1480" cy="100" r="1.3" fill-opacity="0.35"/>
    <circle cx="1050" cy="420" r="1.4" fill-opacity="0.4"/>
    <circle cx="1250" cy="450" r="1.6" fill-opacity="0.4"/>
    <circle cx="1420" cy="410" r="1.2" fill-opacity="0.35"/>
    <circle cx="900" cy="380" r="1.3" fill-opacity="0.3"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="1150" cy="80" r="1" fill-opacity="0.25"/>
    <circle cx="1380" cy="200" r="1" fill-opacity="0.2"/>
    <circle cx="1020" cy="200" r="1" fill-opacity="0.2"/>
    <circle cx="1340" cy="420" r="1" fill-opacity="0.2"/>
  </g>

  <!-- ===== RIGHT SIDE: developer scene ===== -->
  <ellipse cx="1230" cy="280" rx="300" ry="230" fill="url(#deskGlow)" class="glowPulse"/>
  <ellipse cx="1175" cy="220" rx="90" ry="90" fill="url(#rimLight)" filter="url(#tinyBlur)"/>

  <!-- abstract terminal-window silhouette behind figure -->
  <g opacity="0.5" filter="url(#softBlur)">
    <rect x="995" y="55" width="440" height="310" rx="20" fill="none" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="1026" cy="86" r="4" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="1044" cy="86" r="4" fill="#3B82F6" fill-opacity="0.22"/>
    <circle cx="1062" cy="86" r="4" fill="#3B82F6" fill-opacity="0.15"/>
  </g>

  <!-- floor reflection -->
  <ellipse cx="1230" cy="438" rx="240" ry="10" fill="#3B82F6" fill-opacity="0.08" filter="url(#tinyBlur)"/>

  <!-- desk -->
  <line x1="1030" y1="430" x2="1480" y2="430" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="1030" y1="434" x2="1480" y2="434" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1"/>

  <!-- coffee mug, small detail -->
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <rect x="1395" y="404" width="20" height="22" rx="3"/>
    <path d="M 1415 408 Q 1426 408 1426 415 Q 1426 422 1415 422"/>
  </g>
  <line x1="1400" y1="398" x2="1400" y2="402" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1407" y1="396" x2="1407" y2="402" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- monitor -->
  <rect x="1230" y="268" width="172" height="112" rx="6" fill="#0B1220" stroke="#3B82F6" stroke-opacity="0.65" stroke-width="1.5"/>
  <rect x="1238" y="276" width="156" height="96" rx="2" fill="#3B82F6" fill-opacity="0.14" class="screenFlicker"/>
  <g stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.2" fill="none">
    <line x1="1248" y1="290" x2="1320" y2="290"/>
    <line x1="1248" y1="302" x2="1362" y2="302"/>
    <line x1="1248" y1="314" x2="1300" y2="314"/>
    <line x1="1248" y1="326" x2="1347" y2="326"/>
    <line x1="1248" y1="338" x2="1290" y2="338"/>
  </g>
  <rect x="1300" y="380" width="20" height="18" fill="#0B1220" stroke="#3B82F6" stroke-opacity="0.4"/>
  <line x1="1278" y1="398" x2="1342" y2="398" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>

  <!-- chair -->
  <path d="M 1080 430 L 1080 320 Q 1080 290 1110 290 L 1140 290 Q 1160 290 1160 315 L 1160 380"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1080" y1="430" x2="1080" y2="380" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.5"/>

  <!-- figure: refined hooded silhouette -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" opacity="0.92">
    <path d="M 1148 230 Q 1148 198 1176 196 Q 1204 198 1206 230 Q 1207 252 1196 264"/>
    <path d="M 1108 382 Q 1110 298 1150 266 Q 1176 250 1202 266 Q 1234 290 1234 360 L 1234 384"/>
    <path d="M 1155 318 Q 1176 344 1212 350 Q 1236 352 1252 348"/>
  </g>
  <circle cx="1168" cy="274" r="2.2" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="1188" cy="276" r="2.2" fill="#FFFFFF" fill-opacity="0.5"/>
  <!-- subtle rim highlight on hood edge -->
  <path d="M 1150 230 Q 1150 200 1176 198" stroke="#3B82F6" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- keyboard -->
  <rect x="1183" y="392" width="92" height="18" rx="3" fill="none" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.5"/>
  <g fill="#3B82F6" fill-opacity="0.3">
    <rect x="1190" y="397" width="4" height="4"/>
    <rect x="1198" y="397" width="4" height="4"/>
    <rect x="1206" y="397" width="4" height="4"/>
  </g>

  <!-- ===== LEFT SIDE: typography ===== -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="195" font-size="66" font-weight="700" fill="#FFFFFF" letter-spacing="4" filter="url(#glow)">RUDRA TIWARI</text>

    <text x="60" y="240" font-size="22" fill="#3B82F6" font-family="Courier New, monospace">Full Stack Developer</text>
    <text x="60" y="270" font-size="22" fill="#3B82F6" font-family="Courier New, monospace">Problem Solver</text>
    <text x="60" y="300" font-size="22" fill="#3B82F6" font-family="Courier New, monospace">Open Source Learner</text>
  </g>

  <line x1="62" y1="330" x2="220" y2="330" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" fill-opacity="0.94">
    <text x="60" y="375">Code.</text>
    <text x="60" y="410">Learn.</text>
    <text x="60" y="445">Build<tspan fill="#3B82F6" class="cursor">_</tspan></text>
  </g>
</svg>
