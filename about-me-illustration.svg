<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <style>
      @keyframes pulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }
      @keyframes flicker { 0%,100% { opacity:0.5; } 40% { opacity:0.8; } 55% { opacity:0.5; } 75% { opacity:0.7; } }
      @keyframes blink { 0%,45% { opacity:1; } 50%,95% { opacity:0; } 100% { opacity:1; } }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .flicker { animation: flicker 3.2s ease-in-out infinite; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <!-- ambient blue room glow, transparent canvas -->
  <ellipse cx="300" cy="230" rx="260" ry="180" fill="url(#screenGlow)" class="pulse"/>

  <!-- abstract terminal-window panel behind figure (stands in for a GitHub-style backdrop, not the literal logo) -->
  <g opacity="0.45" filter="url(#softBlur)">
    <rect x="120" y="40" width="360" height="260" rx="16" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="146" cy="64" r="3.5" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="160" cy="64" r="3.5" fill="#3B82F6" fill-opacity="0.22"/>
    <circle cx="174" cy="64" r="3.5" fill="#3B82F6" fill-opacity="0.14"/>
  </g>

  <!-- faint terminal prompt text floating top-right -->
  <g font-family="Courier New, monospace" font-size="10" fill="#FFFFFF" fill-opacity="0.18">
    <text x="340" y="80">$ git commit -m "ship"</text>
    <text x="340" y="95">$ npm run build</text>
    <text x="340" y="110">✓ done</text>
  </g>

  <!-- desk surface -->
  <line x1="60" y1="345" x2="540" y2="345" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <line x1="60" y1="349" x2="540" y2="349" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1"/>
  <ellipse cx="300" cy="352" rx="180" ry="8" fill="#3B82F6" fill-opacity="0.07"/>

  <!-- coffee mug -->
  <g stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.6" fill="none">
    <rect x="470" y="312" width="26" height="28" rx="3"/>
    <path d="M 496 318 Q 510 318 510 327 Q 510 336 496 336"/>
  </g>
  <line x1="476" y1="306" x2="476" y2="311" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="485" y1="303" x2="485" y2="311" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- separate mechanical keyboard, in front of laptop -->
  <rect x="245" y="330" width="150" height="22" rx="3" fill="#0B1220" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.4"/>
  <g fill="#3B82F6" fill-opacity="0.28">
    <rect x="252" y="335" width="9" height="9" rx="1"/>
    <rect x="264" y="335" width="9" height="9" rx="1"/>
    <rect x="276" y="335" width="9" height="9" rx="1"/>
    <rect x="288" y="335" width="9" height="9" rx="1"/>
    <rect x="300" y="335" width="9" height="9" rx="1"/>
    <rect x="312" y="335" width="9" height="9" rx="1"/>
    <rect x="324" y="335" width="9" height="9" rx="1"/>
    <rect x="336" y="335" width="40" height="9" rx="1"/>
  </g>

  <!-- laptop -->
  <g>
    <!-- screen -->
    <path d="M 235 195 L 235 320 L 365 320 L 365 195 Z" fill="url(#laptopScreen)" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="243" y="203" width="114" height="100" fill="#3B82F6" fill-opacity="0.10" class="flicker"/>
    <!-- VS Code style code lines -->
    <g stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.3" fill="none">
      <line x1="250" y1="216" x2="285" y2="216"/>
      <line x1="258" y1="226" x2="320" y2="226"/>
      <line x1="258" y1="236" x2="300" y2="236"/>
      <line x1="250" y1="246" x2="270" y2="246"/>
      <line x1="258" y1="256" x2="335" y2="256"/>
      <line x1="258" y1="266" x2="290" y2="266"/>
      <line x1="250" y1="276" x2="270" y2="276"/>
    </g>
    <rect x="260" y="284" width="6" height="10" fill="#3B82F6" class="cursor"/>
    <!-- screen reflection -->
    <line x1="240" y1="200" x2="240" y2="315" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="6"/>

    <!-- base / keyboard deck -->
    <path d="M 220 320 L 380 320 L 392 336 L 208 336 Z" fill="#0B1220" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.4"/>
    <line x1="228" y1="328" x2="372" y2="328" stroke="#3B82F6" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- figure: hooded developer facing laptop, no facial detail -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" opacity="0.92">
    <!-- head + hood -->
    <path d="M 268 150 Q 268 116 300 114 Q 332 116 332 150 Q 333 172 320 184 L 280 184 Q 267 172 268 150 Z"/>
    <!-- shoulders + torso -->
    <path d="M 205 330 Q 208 232 255 196 Q 278 180 300 182 Q 322 180 345 196 Q 392 232 395 330"/>
  </g>
  <!-- hood drawstrings -->
  <circle cx="288" cy="190" r="2.4" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="312" cy="190" r="2.4" fill="#FFFFFF" fill-opacity="0.5"/>
  <!-- soft glow on face area from screen below, no features -->
  <ellipse cx="300" cy="160" rx="34" ry="30" fill="url(#faceLight)"/>
  <!-- rim light along hood edge -->
  <path d="M 270 150 Q 270 118 300 116" stroke="#3B82F6" stroke-width="1.3" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- arms reaching to keyboard -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 248 230 Q 250 290 270 332"/>
    <path d="M 352 230 Q 350 290 370 332"/>
  </g>
</svg>
